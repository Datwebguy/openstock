<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OpenStock Platform Motion Showcase</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      transition: none !important; /* Deterministic rendering */
    }

    body, html {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #09080F;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #viewport {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #09080F;
    }

    /* 3D Camera Stage */
    #camera-stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      transform-origin: 960px 540px;
      will-change: transform;
    }

    /* Screen Frames */
    .platform-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      opacity: 0;
      pointer-events: none;
    }

    .platform-screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Screen Launch is taller */
    #screen-launch {
      height: 2400px;
    }

    #screen-launch img {
      width: 1920px;
      height: 2400px;
      object-fit: initial;
    }

    /* Subtle Cinematic Vignette */
    .screen-vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.25);
      pointer-events: none;
    }

    /* Cursor */
    #cursor {
      position: absolute;
      top: 0;
      left: 0;
      width: 44px;
      height: 44px;
      z-index: 100;
      pointer-events: none;
      transform: translate(-5px, -5px);
    }

    #cursor svg {
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.5));
    }

    /* Click Ripple */
    #click-ripple {
      position: absolute;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 3px solid #14F195;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      pointer-events: none;
      z-index: 99;
      box-shadow: 0 0 25px rgba(20, 241, 149, 0.6);
    }

    /* Kinetic Punch Cuts (Scene 7) */
    #punch-stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #09080F;
      z-index: 80;
    }

    .punch-headline {
      font-size: 110px;
      font-weight: 900;
      letter-spacing: -0.04em;
      text-align: center;
      line-height: 1.05;
    }

    .punch-subhead {
      font-size: 32px;
      font-weight: 700;
      color: #9CA3AF;
      margin-top: 24px;
      letter-spacing: -0.01em;
    }

    /* Outro Brand Stage (Scene 7 outro) */
    #outro-stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      z-index: 90;
    }

    .brand-logo-row {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .brand-logo-icon {
      width: 84px;
      height: 84px;
      border-radius: 24px;
      box-shadow: 0 20px 45px rgba(153, 69, 255, 0.25);
    }

    .brand-title {
      font-size: 88px;
      font-weight: 900;
      color: #111827;
      letter-spacing: -0.04em;
    }

    .brand-tagline {
      font-size: 34px;
      font-weight: 700;
      color: #4B5563;
      margin-top: 18px;
    }

    /* Solana Pill Badge */
    .sol-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(153, 69, 255, 0.08);
      border: 1.5px solid rgba(153, 69, 255, 0.2);
      color: #9945FF;
      padding: 10px 24px;
      border-radius: 9999px;
      font-size: 20px;
      font-weight: 800;
      margin-top: 28px;
      box-shadow: 0 4px 16px rgba(153, 69, 255, 0.12);
    }
  </style>
</head>
<body>
  <div id="viewport">
    <!-- Camera Stage -->
    <div id="camera-stage">
      <!-- 1. Landing Page -->
      <div id="screen-landing" class="platform-screen">
        <img src="../video_assets/actual_screens/01_landing.png" alt="OpenStock Landing Page">
        <div class="screen-vignette"></div>
      </div>

      <!-- 2. Tokenized Equities Desk -->
      <div id="screen-market" class="platform-screen">
        <img src="../video_assets/actual_screens/03_app.png" alt="Tokenized Equities Desk">
        <div class="screen-vignette"></div>
      </div>

      <!-- 3. Asset Trading Terminal (NVDAx Candlestick Chart) -->
      <div id="screen-trading" class="platform-screen">
        <img src="../video_assets/actual_screens/05_asset_nvdax.png" alt="NVDAx Asset Trading Desk">
        <div class="screen-vignette"></div>
      </div>

      <!-- 4. Launchpad Studio -->
      <div id="screen-launch" class="platform-screen">
        <img src="../openstock_launch_filled.png" alt="OpenStock Launchpad Studio">
        <div class="screen-vignette"></div>
      </div>

      <!-- 5. Community Bonding Curves Hub -->
      <div id="screen-community" class="platform-screen">
        <img src="../video_assets/actual_screens/06_community.png" alt="Community Stock Pairs & Memes">
        <div class="screen-vignette"></div>
      </div>

      <!-- 6. Portfolio & Creator Royalty Vaults -->
      <div id="screen-portfolio" class="platform-screen">
        <img src="../video_assets/actual_screens/04_portfolio.png" alt="Portfolio & Creator Royalty Vaults">
        <div class="screen-vignette"></div>
      </div>

      <!-- Click Ripple -->
      <div id="click-ripple"></div>
    </div>

    <!-- Realistic Mouse Cursor -->
    <div id="cursor">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none">
        <path d="M3 3l7 18 3-7 7-3L3 3z" fill="#FFFFFF" stroke="#000000" stroke-width="1.8" stroke-linejoin="round"/>
      </svg>
    </div>

    <!-- Kinetic Punch Cuts (Scene 7) -->
    <div id="punch-stage">
      <div id="punch-title" class="punch-headline" style="color: #14F195;">TRADE 24/7</div>
      <div id="punch-sub" class="punch-subhead">Zero Market Closes · Real U.S. Equities on Solana</div>
    </div>

    <!-- Outro Brand Stage (Scene 7 Outro) -->
    <div id="outro-stage">
      <div class="brand-logo-row">
        <!-- Official OpenStock Logo from app/icon.svg -->
        <svg class="brand-logo-icon" viewBox="0 0 64 64" fill="none">
          <defs>
            <linearGradient id="g_brand" x1="0" y1="0" x2="1" y2="1">
              <stop stop-color="#9945ff"/>
              <stop offset=".55" stop-color="#03e1ff"/>
              <stop offset="1" stop-color="#14f195"/>
            </linearGradient>
          </defs>
          <rect width="64" height="64" rx="18" fill="#07070d"/>
          <circle cx="32" cy="32" r="20" fill="url(#g_brand)"/>
          <path d="M22 27h20M22 33h20M22 39h14" fill="none" stroke="#07070d" stroke-width="4" stroke-linecap="round"/>
        </svg>
        <div class="brand-title">OpenStock</div>
      </div>
      <div class="brand-tagline">Real Stocks. On Solana.</div>
      <div class="sol-badge">◎ Powered by Solana & Meteora DLMM</div>
    </div>
  </div>

  <script>
    // Elements
    const stage = document.getElementById('camera-stage');
    const sLanding = document.getElementById('screen-landing');
    const sMarket = document.getElementById('screen-market');
    const sTrading = document.getElementById('screen-trading');
    const sLaunch = document.getElementById('screen-launch');
    const sCommunity = document.getElementById('screen-community');
    const sPortfolio = document.getElementById('screen-portfolio');
    const cursor = document.getElementById('cursor');
    const ripple = document.getElementById('click-ripple');
    const punchStage = document.getElementById('punch-stage');
    const punchTitle = document.getElementById('punch-title');
    const punchSub = document.getElementById('punch-sub');
    const outroStage = document.getElementById('outro-stage');

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    // ----------------------------------------------------------------
    // TIME STEPPER: window.seekTime(t)
    // ----------------------------------------------------------------
    window.seekTime = function(t) {
      // Default reset
      sLanding.style.opacity = '0';
      sMarket.style.opacity = '0';
      sTrading.style.opacity = '0';
      sLaunch.style.opacity = '0';
      sCommunity.style.opacity = '0';
      sPortfolio.style.opacity = '0';
      cursor.style.display = 'block';
      ripple.style.opacity = '0';
      punchStage.style.display = 'none';
      outroStage.style.display = 'none';

      // ==============================================================
      // SCENE 1: Landing Page Hero & Value Prop (0.0s -> 4.5s)
      // VO: "Welcome to OpenStock. Real tokenized stocks on Solana." (0.4s - 4.5s)
      // ==============================================================
      if (t < 4.5) {
        sLanding.style.opacity = '1';

        // Camera smoothly glides from overview towards the live NVDAx widget
        let camX = 0, camY = 0, camScale = 1.0;
        let curX = 1400, curY = 850;

        if (t < 2.0) {
          const p = t / 2.0;
          const ep = easeOutCubic(p);
          camScale = 1.0 + 0.07 * ep;
          camX = -30 * ep;
          camY = -15 * ep;
          curX = 1400 - 450 * ep;
          curY = 850 - 280 * ep;
        } else if (t < 3.6) {
          const p = (t - 2.0) / 1.6;
          const ep = easeInOutCubic(p);
          camScale = 1.07 + 0.12 * ep;
          camX = -30 - 90 * ep;
          camY = -15 + 10 * ep;
          // Cursor glides towards "Explore Markets ->" (x: 480, y: 525)
          curX = 950 - 470 * ep;
          curY = 570 - 45 * ep;
        } else {
          // Click!
          camScale = 1.19;
          camX = -120;
          camY = -5;
          curX = 480;
          curY = 525;

          const rp = (t - 3.6) / 0.8;
          ripple.style.left = `${curX}px`;
          ripple.style.top = `${curY}px`;
          ripple.style.transform = `translate(-50%, -50%) scale(${1 + rp * 2.5})`;
          ripple.style.opacity = `${Math.max(0, 1 - rp)}`;
        }

        stage.style.transform = `scale(${camScale}) translate(${camX}px, ${camY}px)`;
        cursor.style.transform = `translate(${curX}px, ${curY}px)`;
        return;
      }

      // ==============================================================
      // SCENE 2: Tokenized Equities Desk (4.5s -> 9.3s)
      // VO: "Trade Apple, Nvidia, and Tesla twenty-four seven with deep liquidity." (4.6s - 8.7s)
      // ==============================================================
      if (t >= 4.5 && t < 9.3) {
        sMarket.style.opacity = '1';
        const p = (t - 4.5) / 4.8;
        const ep = easeOutCubic(p);

        // Smooth camera drift over top stats and market table
        const camScale = 1.10 + 0.08 * ep;
        const camX = 10 - 50 * ep;
        const camY = 30 - 60 * ep;
        stage.style.transform = `scale(${camScale}) translate(${camX}px, ${camY}px)`;

        // Cursor glides over NVDAx row and clicks
        let curX = 600, curY = 400;
        if (t < 7.5) {
          const cp = (t - 4.5) / 3.0;
          curX = 500 + 420 * easeInOutCubic(cp);
          curY = 320 + 130 * easeInOutCubic(cp);
        } else {
          curX = 920;
          curY = 450;
          // Click ripple
          if (t >= 8.2) {
            const rp = (t - 8.2) / 0.8;
            ripple.style.left = `${curX}px`;
            ripple.style.top = `${curY}px`;
            ripple.style.transform = `translate(-50%, -50%) scale(${1 + rp * 2.2})`;
            ripple.style.opacity = `${Math.max(0, 1 - rp)}`;
          }
        }
        cursor.style.transform = `translate(${curX}px, ${curY}px)`;
        return;
      }

      // ==============================================================
      // SCENE 3: NVDAx Asset Trading Desk & Candlestick Chart (9.3s -> 14.1s)
      // VO: "Backed one-to-one by real shares with live Pyth benchmarks." (9.4s - 13.1s)
      // ==============================================================
      if (t >= 9.3 && t < 14.1) {
        sTrading.style.opacity = '1';
        const p = (t - 9.3) / 4.8;
        const ep = easeOutCubic(p);

        // Zoom into candlestick chart and Order panel
        const camScale = 1.15 + 0.10 * ep;
        const camX = -40 - 50 * ep;
        const camY = -30 - 30 * ep;
        stage.style.transform = `scale(${camScale}) translate(${camX}px, ${camY}px)`;

        // Cursor hovers chart and moves to Buy NVDAx
        let curX = 700, curY = 600;
        if (t < 12.0) {
          const cp = (t - 9.3) / 2.7;
          curX = 650 + 200 * Math.sin(cp * Math.PI);
          curY = 620 - 40 * Math.cos(cp * Math.PI);
        } else {
          const cp = (t - 12.0) / 1.2;
          curX = 750 + 250 * easeOutCubic(Math.min(1, cp));
          curY = 580 + 80 * easeOutCubic(Math.min(1, cp));

          if (t >= 13.0) {
            const rp = (t - 13.0) / 0.8;
            ripple.style.left = `${curX}px`;
            ripple.style.top = `${curY}px`;
            ripple.style.transform = `translate(-50%, -50%) scale(${1 + rp * 2.5})`;
            ripple.style.opacity = `${Math.max(0, 1 - rp)}`;
          }
        }

        cursor.style.transform = `translate(${curX}px, ${curY}px)`;
        return;
      }

      // ==============================================================
      // SCENE 4: Launchpad Studio (14.1s -> 19.1s)
      // VO: "Launch community tokens paired against stocks, and earn creator royalties." (14.2s - 18.3s)
      // ==============================================================
      if (t >= 14.1 && t < 19.1) {
        sLaunch.style.opacity = '1';
        const p = (t - 14.1) / 5.0;
        const ep = easeInOutCubic(p);

        // Continuous smooth cinematic scroll down the launch form
        const scrollY = -220 - ep * 1150;
        const camScale = 1.20;
        stage.style.transform = `scale(${camScale}) translate(-10px, ${scrollY}px)`;

        // Cursor glides down through the inputs
        let curX = 960, curY = 580;
        if (t < 16.2) {
          curX = 700 + (t - 14.1) * 70;
          curY = 540;
        } else if (t < 17.8) {
          curX = 1180;
          curY = 550; // Royalty slider area
        } else {
          curX = 960;
          curY = 680; // Connect wallet / launch button

          if (t >= 18.2) {
            const rp = (t - 18.2) / 0.8;
            ripple.style.left = `${curX}px`;
            ripple.style.top = `${curY}px`;
            ripple.style.transform = `translate(-50%, -50%) scale(${1 + rp * 2.5})`;
            ripple.style.opacity = `${Math.max(0, 1 - rp)}`;
          }
        }

        cursor.style.transform = `translate(${curX}px, ${curY}px)`;
        return;
      }

      // ==============================================================
      // SCENE 5: Community Bonding Curves & Meteora DLMM Migration (19.1s -> 23.5s)
      // VO: "Bonding curves migrate automatically to concentrated Meteora pools." (19.2s - 23.0s)
      // ==============================================================
      if (t >= 19.1 && t < 23.5) {
        sCommunity.style.opacity = '1';
        const p = (t - 19.1) / 4.4;
        const ep = easeOutCubic(p);

        // Camera zooms in on Trump Bucks (82.5%) & Macavity bonding curves
        const camScale = 1.24 + 0.08 * ep;
        const camX = 10 - 45 * ep;
        const camY = -30 - 15 * ep;
        stage.style.transform = `scale(${camScale}) translate(${camX}px, ${camY}px)`;

        // Cursor moves to Ape $TrumpBucks ⚡ button and clicks
        let curX = 490, curY = 740;
        if (t < 21.2) {
          const cp = (t - 19.1) / 2.1;
          curX = 400 + 90 * easeOutCubic(cp);
          curY = 650 + 90 * easeOutCubic(cp);
        } else {
          curX = 490;
          curY = 740;
          if (t >= 21.8) {
            const rp = (t - 21.8) / 0.8;
            ripple.style.left = `${curX}px`;
            ripple.style.top = `${curY}px`;
            ripple.style.transform = `translate(-50%, -50%) scale(${1 + rp * 2.5})`;
            ripple.style.opacity = `${Math.max(0, 1 - rp)}`;
          }
        }

        cursor.style.transform = `translate(${curX}px, ${curY}px)`;
        return;
      }

      // ==============================================================
      // SCENE 6: Portfolio & Creator Royalty Vaults (23.5s -> 27.5s)
      // VO: "Track your portfolio and claim stock rewards in real time." (23.6s - 26.9s)
      // ==============================================================
      if (t >= 23.5 && t < 27.5) {
        sPortfolio.style.opacity = '1';
        const p = (t - 23.5) / 4.0;
        const ep = easeOutCubic(p);

        const camScale = 1.14 + 0.06 * ep;
        const camX = 0;
        const camY = 15 - 25 * ep;
        stage.style.transform = `scale(${camScale}) translate(${camX}px, ${camY}px)`;

        // Smooth cursor glide over royalty vaults
        const curX = 850 + 120 * ep;
        const curY = 460 + 20 * Math.sin(ep * Math.PI);
        cursor.style.transform = `translate(${curX}px, ${curY}px)`;
        return;
      }

      // ==============================================================
      // SCENE 7: Kinetic Snare Cuts & Brand Outro (27.5s -> 32.66s)
      // VO: "OpenStock. Real stocks on Solana." (28.5s - 32.1s)
      // ==============================================================
      if (t >= 27.5 && t < 28.5) {
        punchStage.style.display = 'flex';
        cursor.style.display = 'none';

        if (t < 28.0) {
          punchTitle.innerText = "TRADE 24/7";
          punchTitle.style.color = "#14F195";
          punchSub.innerText = "25 Tokenized US Equities · Zero Market Closes";
        } else {
          punchTitle.innerText = "STOCK-BACKED";
          punchTitle.style.color = "#03E1FF";
          punchSub.innerText = "1:1 Real Underlying Shares · On Solana";
        }

        const beat = (t - 27.5) % 0.5;
        const punchScale = 1.08 - 0.08 * Math.min(1, beat / 0.15);
        punchStage.style.transform = `scale(${punchScale})`;
        return;
      }

      if (t >= 28.5) {
        outroStage.style.display = 'flex';
        cursor.style.display = 'none';

        const p = Math.min(1, (t - 28.5) / 0.5);
        const ep = easeOutCubic(p);
        outroStage.style.transform = `scale(${0.92 + 0.08 * ep})`;
        outroStage.style.opacity = `${ep}`;
      }
    };

    // Initialize at frame 0
    window.seekTime(0);
  </script>
</body>
</html>
