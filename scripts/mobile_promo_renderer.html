<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OpenStock - 3D Mobile App Cinematic Promo</title>
  <style>
    /* System font stack for zero-latency local rendering */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      transition: none !important; /* Deterministic rendering */
    }

    body, html {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #08070D;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #viewport {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #08070D;
    }

    /* Ambient Dynamic Background Stage */
    #ambient-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, #1e1338 0%, #0c0817 60%, #06040a 100%);
      transition: background 0.3s ease;
    }

    /* Speed Stripes Layer (Scene 2 & 5) */
    #speed-stripes {
      position: absolute;
      inset: -50%;
      width: 200%;
      height: 200%;
      background: repeating-linear-gradient(
        -45deg,
        transparent,
        transparent 60px,
        rgba(153, 69, 255, 0.04) 60px,
        rgba(153, 69, 255, 0.04) 120px
      );
      opacity: 0;
      pointer-events: none;
    }

    /* Primary Kinetic Typography Layer (Top Headline Tier) */
    #kinetic-bg-text {
      position: absolute;
      top: 75px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 1600px;
      padding: 0 40px;
      box-sizing: border-box;
      text-align: center;
      text-transform: uppercase;
      z-index: 30;
      pointer-events: none;
      opacity: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    #text-line-1, #text-line-2 {
      font-size: 50px;
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1.08;
      white-space: nowrap;
      text-align: center;
    }

    #text-line-1 {
      color: #ffffff;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
    }

    #text-line-2 {
      color: #03e1ff;
      background: linear-gradient(135deg, #03e1ff 0%, #14f195 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 15px rgba(20, 241, 149, 0.35));
    }

    /* 3D Master Scene Stage */
    #scene-stage {
      position: absolute;
      inset: 0;
      perspective: 1600px;
      perspective-origin: 50% 50%;
      transform-style: preserve-3d;
      z-index: 20;
    }

    /* Realistic iPhone 15 Pro Chassis */
    .iphone-device {
      position: absolute;
      width: 366px;
      height: 614px;
      top: 560px;
      left: 50%;
      margin-top: -307px;
      margin-left: -183px;
      transform-style: preserve-3d;
      will-change: transform, opacity;
    }

    .iphone-frame {
      position: absolute;
      inset: 0;
      border-radius: 46px;
      background: #181524;
      border: 4px solid #3c364e;
      box-shadow: 
        inset 0 0 4px 2px rgba(255, 255, 255, 0.2),
        0 25px 60px rgba(0, 0, 0, 0.75),
        0 40px 120px rgba(153, 69, 255, 0.25);
      overflow: hidden;
      padding: 10px;
      box-sizing: border-box;
    }

    .iphone-screen {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 36px;
      background: #0d0c14;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .iphone-screen img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Dynamic Island Pill */
    .iphone-island {
      display: none;
    }

    .island-lens {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #111a33;
      border: 1px solid #1a2544;
    }

    .island-sensor {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #1a1726;
    }

    /* Front Kinetic Tag Strip */
    #front-tag-strip {
      position: absolute;
      bottom: 80px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      z-index: 60;
      pointer-events: none;
    }

    .tag-pill {
      background: rgba(18, 14, 30, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(153, 69, 255, 0.35);
      border-radius: 9999px;
      padding: 14px 36px;
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .tag-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #14f195;
      box-shadow: 0 0 12px #14f195;
    }

    /* Outro Card Overlay */
    #outro-card {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, #15102a 0%, #090614 65%, #030208 100%);
      z-index: 100;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
    }

    .outro-brand-row {
      display: flex;
      align-items: center;
      gap: 28px;
      margin-bottom: 18px;
    }

    .outro-title {
      font-size: 102px;
      font-weight: 900;
      letter-spacing: -0.04em;
      color: #ffffff;
      text-shadow: 0 10px 40px rgba(153, 69, 255, 0.4);
    }

    .outro-tagline {
      font-size: 34px;
      font-weight: 700;
      color: #94a3b8;
      margin-bottom: 40px;
      letter-spacing: 0.02em;
    }

    .outro-cta-btn {
      background: linear-gradient(135deg, #9945ff 0%, #03e1ff 50%, #14f195 100%);
      color: #06050b;
      font-size: 26px;
      font-weight: 900;
      padding: 20px 56px;
      border-radius: 9999px;
      box-shadow: 0 0 50px rgba(20, 241, 149, 0.4), 0 20px 40px rgba(153, 69, 255, 0.35);
      letter-spacing: 0.03em;
    }
  </style>
</head>
<body>
  <div id="viewport">
    <div id="ambient-bg"></div>
    <div id="speed-stripes"></div>

    <!-- Kinetic Typography Behind Devices -->
    <div id="kinetic-bg-text">
      <div id="text-line-1">WALL STREET SLEEPS</div>
      <div id="text-line-2" class="outline-text">SOLANA DOESN'T</div>
    </div>

    <!-- 3D Scene Stage with 5 iPhone Devices -->
    <div id="scene-stage">
      <!-- Phone 1 (Center / Hero) -->
      <div id="phone-center" class="iphone-device">
        <div class="iphone-frame">
          <div class="iphone-screen">
            <div class="iphone-island"><span class="island-sensor"></span><span class="island-lens"></span></div>
            <img id="img-center" src="../video_assets/mobile_screens/01_home_hero.png" alt="OpenStock Hero">
          </div>
        </div>
      </div>

      <!-- Phone 2 (Left Mid) -->
      <div id="phone-left-mid" class="iphone-device">
        <div class="iphone-frame">
          <div class="iphone-screen">
            <div class="iphone-island"><span class="island-sensor"></span><span class="island-lens"></span></div>
            <img id="img-left-mid" src="../video_assets/mobile_screens/02_market_discovery.png" alt="Market Discovery">
          </div>
        </div>
      </div>

      <!-- Phone 3 (Right Mid) -->
      <div id="phone-right-mid" class="iphone-device">
        <div class="iphone-frame">
          <div class="iphone-screen">
            <div class="iphone-island"><span class="island-sensor"></span><span class="island-lens"></span></div>
            <img id="img-right-mid" src="../video_assets/mobile_screens/03_asset_nvdax.png" alt="NVDAx Terminal">
          </div>
        </div>
      </div>

      <!-- Phone 4 (Far Left) -->
      <div id="phone-far-left" class="iphone-device">
        <div class="iphone-frame">
          <div class="iphone-screen">
            <div class="iphone-island"><span class="island-sensor"></span><span class="island-lens"></span></div>
            <img id="img-far-left" src="../video_assets/mobile_screens/04_launch_studio.png" alt="Launch Studio">
          </div>
        </div>
      </div>

      <!-- Phone 5 (Far Right) -->
      <div id="phone-far-right" class="iphone-device">
        <div class="iphone-frame">
          <div class="iphone-screen">
            <div class="iphone-island"><span class="island-sensor"></span><span class="island-lens"></span></div>
            <img id="img-far-right" src="../video_assets/mobile_screens/05_community_radar.png" alt="Community Radar">
          </div>
        </div>
      </div>
    </div>

    <!-- Front Feature Tag Strip -->
    <div id="front-tag-strip">
      <div class="tag-pill" id="feature-tag">
        <span class="tag-dot"></span>
        <span id="tag-text">24/7 TOKENIZED EQUITIES ON SOLANA</span>
      </div>
    </div>

    <!-- Outro Stage Card -->
    <div id="outro-card">
      <div class="outro-brand-row">
        <svg width="90" height="90" viewBox="0 0 64 64" fill="none">
          <defs>
            <linearGradient id="g_brand" x1="0" y1="0" x2="1" y2="1">
              <stop stop-color="#9945ff"/>
              <stop offset=".55" stop-color="#03e1ff"/>
              <stop offset="1" stop-color="#14f195"/>
            </linearGradient>
          </defs>
          <rect width="64" height="64" rx="18" fill="#07070d"/>
          <circle cx="32" cy="32" r="20" fill="url(#g_brand)"/>
          <path d="M22 27h20M22 33h20M22 39h14" fill="none" stroke="#07070d" stroke-width="4" stroke-linecap="round"/>
        </svg>
        <h1 class="outro-title">OpenStock</h1>
      </div>
      <p class="outro-tagline">Real Stocks. On Solana. 24/7.</p>
      <div class="outro-cta-btn">openstock.up.railway.app</div>
    </div>
  </div>

  <script>
    // Easing helper
    function easeInOutCubic(x) {
      return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
    }
    function easeOutBack(x) {
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
    }
    function clamp(val, min, max) {
      return Math.min(Math.max(val, min), max);
    }

    const pCenter = document.getElementById('phone-center');
    const pLeftMid = document.getElementById('phone-left-mid');
    const pRightMid = document.getElementById('phone-right-mid');
    const pFarLeft = document.getElementById('phone-far-left');
    const pFarRight = document.getElementById('phone-far-right');
    const kineticText = document.getElementById('kinetic-bg-text');
    const text1 = document.getElementById('text-line-1');
    const text2 = document.getElementById('text-line-2');
    const tagStrip = document.getElementById('front-tag-strip');
    const tagText = document.getElementById('tag-text');
    const outro = document.getElementById('outro-card');
    const stripes = document.getElementById('speed-stripes');

    const imgCenter = document.getElementById('img-center');
    const imgLeftMid = document.getElementById('img-left-mid');
    const imgRightMid = document.getElementById('img-right-mid');
    const imgFarLeft = document.getElementById('img-far-left');
    const imgFarRight = document.getElementById('img-far-right');

    // Deterministic seek function
    window.seekTime = function(t) {
      // Reset default dimensions
      pCenter.style.width = '366px';
      pCenter.style.height = '614px';
      pCenter.style.marginTop = '-307px';
      pCenter.style.marginLeft = '-183px';
      pCenter.style.top = '560px';
      tagStrip.style.display = 'flex';

      // SCENE 1: 0.0s - 4.8s (Hero Single Phone Entrance + Kinetic Typography)
      if (t < 4.8) {
        outro.style.display = 'none';
        stripes.style.opacity = '0';
        pFarLeft.style.opacity = '0';
        pFarRight.style.opacity = '0';
        pLeftMid.style.opacity = '0';
        pRightMid.style.opacity = '0';

        kineticText.style.opacity = '1';
        text1.textContent = 'WALL STREET SLEEPS';
        text1.className = '';
        text2.textContent = "SOLANA DOESN'T";
        text2.className = '';

        imgCenter.src = '../video_assets/mobile_screens/01_home_hero.png';

        const p = clamp(t / 4.8, 0, 1);
        const sc = 0.94 + easeInOutCubic(p) * 0.16;
        const ry = (1 - easeInOutCubic(p)) * -14;
        const rz = (1 - easeInOutCubic(p)) * 4;

        pCenter.style.opacity = '1';
        pCenter.style.transform = `scale(${sc}) rotateY(${ry}deg) rotateZ(${rz}deg) translateZ(60px)`;
        tagText.textContent = '24/7 TOKENIZED EQUITIES ON SOLANA';
        return;
      }

      // SCENE 2: 4.8s - 9.8s (Trio Isometric Cascade - Market Discovery & NVDAx)
      if (t < 9.8) {
        outro.style.display = 'none';
        stripes.style.opacity = '0.75';
        kineticText.style.opacity = '1';
        text1.textContent = '25 CURATED BLUE-CHIPS';
        text1.className = '';
        text2.textContent = '1:1 PHYSICALLY BACKED';
        text2.className = '';

        imgCenter.src = '../video_assets/mobile_screens/01_home_hero.png';
        imgLeftMid.src = '../video_assets/mobile_screens/02_market_discovery.png';
        imgRightMid.src = '../video_assets/mobile_screens/03_asset_nvdax.png';

        pFarLeft.style.opacity = '0';
        pFarRight.style.opacity = '0';
        pLeftMid.style.opacity = '1';
        pRightMid.style.opacity = '1';
        pCenter.style.opacity = '1';

        // Trio layout matching reference video
        pCenter.style.transform = `translateX(0px) scale(1.02) translateZ(80px)`;
        pLeftMid.style.transform = `translateX(-390px) translateY(10px) rotateY(16deg) rotateX(4deg) scale(0.92) translateZ(-40px)`;
        pRightMid.style.transform = `translateX(390px) translateY(10px) rotateY(-16deg) rotateX(4deg) scale(0.92) translateZ(-40px)`;
        tagText.textContent = 'INSTITUTIONAL RESERVES · PYTH HERMES BENCHMARK';
        return;
      }

      // SCENE 3: 9.8s - 14.5s (Macro Focus on Terminal & Chart)
      if (t < 14.5) {
        outro.style.display = 'none';
        stripes.style.opacity = '0.4';
        kineticText.style.opacity = '1';
        text1.textContent = 'NVDAx · AAPLx · TSLAx';
        text1.className = '';
        text2.textContent = 'LIVE ON-CHAIN DEPTH';
        text2.className = '';

        imgCenter.src = '../video_assets/mobile_screens/03_asset_nvdax.png';

        const p = clamp((t - 9.8) / 4.7, 0, 1);
        pFarLeft.style.opacity = '0';
        pFarRight.style.opacity = '0';
        pLeftMid.style.opacity = '0';
        pRightMid.style.opacity = '0';
        pCenter.style.opacity = '1';

        // Camera macro punch into center phone showing chart & oracle price
        const zoom = 1.02 + easeInOutCubic(p) * 0.28;
        const tiltX = 6 * Math.sin(p * Math.PI);
        pCenter.style.transform = `scale(${zoom}) rotateX(${tiltX}deg) translateY(-10px) translateZ(100px)`;
        tagText.textContent = 'PYTH ORACLES & METEORA DLMM LIQUIDITY';
        return;
      }

      // SCENE 4: 14.5s - 19.2s (Launch Studio & Meteora Bonding Curves)
      if (t < 19.2) {
        outro.style.display = 'none';
        stripes.style.opacity = '0.6';
        kineticText.style.opacity = '1';
        text1.textContent = 'LAUNCH COMMUNITY TOKENS';
        text1.className = '';
        text2.textContent = 'PAIR ANY STOCK';
        text2.className = '';

        imgCenter.src = '../video_assets/mobile_screens/04_launch_studio.png';
        imgLeftMid.src = '../video_assets/mobile_screens/05_community_radar.png';

        pFarLeft.style.opacity = '0';
        pFarRight.style.opacity = '0';
        pLeftMid.style.opacity = '1';
        pRightMid.style.opacity = '0';
        pCenter.style.opacity = '1';

        pCenter.style.transform = `translateX(180px) scale(1.0) rotateY(-8deg) translateZ(40px)`;
        pLeftMid.style.transform = `translateX(-220px) scale(0.94) rotateY(10deg) translateZ(-40px)`;
        tagText.textContent = 'PAIR WITH NVDAx · METEORA DYNAMIC BONDING CURVES';
        return;
      }

      // SCENE 5: 19.2s - 24.5s (5-Phone Fan Layout: Full Pool Migration)
      if (t < 24.5) {
        outro.style.display = 'none';
        stripes.style.opacity = '0.8';
        kineticText.style.opacity = '1';
        text1.textContent = 'AUTONOMOUS POOL MIGRATION';
        text1.className = '';
        text2.textContent = 'METEORA DAMM v2 LOCK';
        text2.className = '';

        imgFarLeft.src = '../video_assets/mobile_screens/04_launch_studio.png';
        imgLeftMid.src = '../video_assets/mobile_screens/02_market_discovery.png';
        imgCenter.src = '../video_assets/mobile_screens/01_home_hero.png';
        imgRightMid.src = '../video_assets/mobile_screens/03_asset_nvdax.png';
        imgFarRight.src = '../video_assets/mobile_screens/05_community_radar.png';

        pFarLeft.style.opacity = '1';
        pLeftMid.style.opacity = '1';
        pCenter.style.opacity = '1';
        pRightMid.style.opacity = '1';
        pFarRight.style.opacity = '1';

        // 5-phone fan expansion
        pFarLeft.style.transform = `translateX(-540px) rotateZ(-8deg) scale(0.82) translateZ(-80px)`;
        pLeftMid.style.transform = `translateX(-270px) rotateZ(-4deg) scale(0.92) translateZ(-30px)`;
        pCenter.style.transform = `translateX(0px) rotateZ(0deg) scale(1.04) translateZ(80px)`;
        pRightMid.style.transform = `translateX(270px) rotateZ(4deg) scale(0.92) translateZ(-30px)`;
        pFarRight.style.transform = `translateX(540px) rotateZ(8deg) scale(0.82) translateZ(-80px)`;

        tagText.textContent = 'METEORA DAMM v2 FULL POOL · ZERO RUG RISK';
        return;
      }

      // SCENE 6: 24.5s - 28.5s (Landscape Reorientation Flip - Automation)
      if (t < 28.5) {
        outro.style.display = 'none';
        stripes.style.opacity = '0.3';
        pFarLeft.style.opacity = '0';
        pFarRight.style.opacity = '0';
        pLeftMid.style.opacity = '0';
        pRightMid.style.opacity = '0';
        pCenter.style.opacity = '1';

        kineticText.style.opacity = '1';
        text1.textContent = 'AUTOMATE YOUR EDGE';
        text1.className = '';
        text2.textContent = 'LIMIT · DCA · VAULTS';
        text2.className = '';

        pCenter.style.top = '550px';
        pCenter.style.width = '940px';
        pCenter.style.height = '540px';
        pCenter.style.marginTop = '-270px';
        pCenter.style.marginLeft = '-470px';
        imgCenter.src = '../video_assets/desktop_screens/desktop_04_asset_nvda.png';

        const p = clamp((t - 24.5) / 4.0, 0, 1);
        const sc = 0.95 + easeInOutCubic(p) * 0.12;
        pCenter.style.transform = `scale(${sc}) translateZ(80px)`;
        tagText.textContent = 'NON-CUSTODIAL VAULTS & LIMIT ORDERS';
        return;
      }

      // SCENE 7: 28.5s - 32.7s (Cinematic Outro Brand Stage with Dual Phones)
      outro.style.display = 'flex';
      stripes.style.opacity = '0';
      pFarLeft.style.opacity = '0';
      pFarRight.style.opacity = '0';
      pLeftMid.style.opacity = '0';
      pRightMid.style.opacity = '0';
      pCenter.style.opacity = '0';
      kineticText.style.opacity = '0';
      tagStrip.style.display = 'none';
    };
  </script>
</body>
</html>
