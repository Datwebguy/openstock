<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360">
  <defs>
    <linearGradient id="solanaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9945FF" />
      <stop offset="50%" stop-color="#03E1FF" />
      <stop offset="100%" stop-color="#14F195" />
    </linearGradient>
    <linearGradient id="textGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="360" height="360" rx="32" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />

  <!-- Badge Mark (Centered: x = 180 - 50 = 130, y = 56, width 100, height 100) -->
  <g transform="translate(130, 56)">
    <path d="M31 0 H69 A31 31 0 0 1 100 31 V69 A31 31 0 0 1 69 100 H8 A8 8 0 0 1 0 92 V31 A31 31 0 0 1 31 0 Z" fill="url(#solanaGrad)" />
    <g transform="translate(50, 50)">
      <circle cx="0" cy="0" r="26" fill="none" stroke="#07070D" stroke-width="6.5" />
      <path d="M-26 0 A26 26 0 0 0 26 0 Z" fill="#07070D" />
    </g>
  </g>

  <!-- Typography (Centered) -->
  <text x="180" y="224" text-anchor="middle" font-family="system-ui, -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.03em">
    <tspan fill="#07070D">Open</tspan><tspan fill="url(#textGradLight)">Stock</tspan>
  </text>
  
  <text x="180" y="254" text-anchor="middle" font-family="system-ui, -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="0.24em" fill="#64748B">
    SOLANA EQUITY PROTOCOL
  </text>

  <!-- Subtle Solana pill tag -->
  <g transform="translate(110, 280)">
    <rect width="140" height="26" rx="13" fill="rgba(124, 58, 237, 0.08)" stroke="rgba(124, 58, 237, 0.2)" stroke-width="1" />
    <text x="70" y="17" text-anchor="middle" font-family="system-ui, -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="650" fill="#7C3AED">
      Meteora · Jupiter
    </text>
  </g>
</svg>
